  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function landPoints(step){
  const pts = [];
  for (let lat = -58; lat <= 82; lat += step) {
    const lonStep = step / Math.max(.2, Math.cos(lat * Math.PI / 180));
    for (let lon = -180; lon < 180; lon += lonStep) {
      if (LAND.some(p => inPoly(lon, lat, p))) {
        const la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
        pts.push(Math.cos(la), Math.sin(la), lo);
      }
    }
  }
  return new Float32Array(pts);
}
function createGlobe(canvas, o){
  const ctx = canvas.getContext("2d");
  const pts = landPoints(o.step);
  let W = 0, H = 0, dpr = 1;
  const BUCKETS = 10, paths = Array.from({length:BUCKETS}, () => []);
  function resize(){
    dpr = Math.min(Math.max(devicePixelRatio || 1, 1) * CONFIG.quality.supersample, 2.5);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  }
  function render(time){
    const { cx, cy, R } = o.layout(W, H);
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const g = ctx.createRadialGradient(cx, cy, R*.82, cx, cy, R*1.18);
    g.addColorStop(0, "rgba(153,69,255,0)"); g.addColorStop(.55, `rgba(20,241,149,${o.glow})`); g.addColorStop(1, "rgba(153,69,255,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R*1.18, 0, Math.PI*2); ctx.fill();
    const rot = o.rot + time * o.speed, ct = Math.cos(o.tilt), st = Math.sin(o.tilt);
    const [Lx, Ly, Lz] = o.light;
    for (const b of paths) b.length = 0;
    for (let i = 0; i < pts.length; i += 3) {
      const cl = pts[i], sl = pts[i+1], lo = pts[i+2] + rot;
      const x = cl * Math.sin(lo), y0 = sl, z0 = cl * Math.cos(lo);
      const y = y0*ct - z0*st, z = y0*st + z0*ct;
      if (z <= 0) continue;
      const lit = Math.max(0, x*Lx + y*Ly + z*Lz);
      const rim = Math.pow(1 - z, 2.2);
      const v = Math.min(1, (o.base ?? .18) + lit*.6 + rim*o.rim);
      const k = Math.min(BUCKETS-1, Math.floor(v*BUCKETS));
      paths[k].push(cx + x*R, cy - y*R, o.dot*(.55 + .55*z));
    }
    for (let k = 0; k < BUCKETS; k++) {
      const a = paths[k]; if (!a.length) continue;
      const v = (k + .5) / BUCKETS;
      ctx.fillStyle = `rgba(${Math.round(153-110*v*v)},${Math.round(69+172*v*v)},${Math.round(255-100*v)},${(.28+.72*v).toFixed(3)})`;
      ctx.beginPath();
      for (let i = 0; i < a.length; i += 3) { const r = a[i+2]/2; ctx.moveTo(a[i]+r, a[i+1]); ctx.arc(a[i], a[i+1], r, 0, 6.2832); }
      ctx.fill();
    }
  }
  resize();
  return { resize, render, canvas };
}

// Net balance per party after a given step (exercise path for step 4).
function ledgerAt(m, idx){
  const b = { seller:[0,0], escrow:[0,0], buyer:[0,0], fees:[0,0], st:[0,0], bb:[0,0], op:[0,0] };
  const mv = (a, amt, from, to) => { b[from][a] -= amt; b[to][a] += amt; };
  m.call ? mv(0, m.A, "seller", "escrow") : mv(1, m.K, "seller", "escrow");
  if (idx >= 1) { mv(1, m.pS, "buyer", "seller"); mv(1, m.pF, "buyer", "fees"); }
  if (idx === 2 || idx === 4) {
    if (m.call) { mv(1, m.kS, "buyer", "seller"); mv(1, m.kF, "buyer", "fees"); mv(0, m.A, "escrow", "buyer"); }
    else { mv(0, m.A, "buyer", "seller"); mv(1, m.kS, "escrow", "buyer"); mv(1, m.kF, "escrow", "fees"); }
  }
  if (idx === 3) m.call ? mv(0, m.A, "escrow", "seller") : mv(1, m.K, "escrow", "seller");
  if (idx === 4) { const F = b.fees[1]; mv(1, F*.3, "fees", "st"); mv(1, F*.2, "fees", "bb"); mv(1, F*.5, "fees", "op"); b.fees[1] = 0; }
  return b;
}

const lab = (() => {
  const $ = id => document.getElementById(id);
  const pre = $("labPresets"), inA = $("lbAmt"), inK = $("lbK"), inP = $("lbP"), sl = $("lbS");

  function load(i){ pi = i; const x = CONFIG.tokens[i]; inA.value = x.amount; inK.value = x.strike; inP.value = x.premium; sl.value = x.side === "call" ? 135 : 65;
    pre.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.i === i)); draw(); }
  pre.addEventListener("click", e => { const b = e.target.closest("button"); if (b) load(+b.dataset.i); });
  [inA, inK, inP, sl].forEach(el => el.addEventListener("input", draw));
  const num = el => Math.max(0, parseFloat(String(el.value).replace(/,/g, "")) || 0);
  function outcome(side, A, K, P, S){
    const pS = P*.97, kS = K*.999, val = A*S;
    if (side === "call") { const ex = val > K; return { ex, val, buyer:(ex ? val - K : 0) - P, seller: pS + (ex ? kS - val : 0) }; }
    const ex = val < kS; return { ex, val, buyer:(ex ? kS - val : 0) - P, seller: pS + (ex ? val - K : 0) };
  }
  function draw(){
    const x = CONFIG.tokens[pi], side = x.side, A = num(inA), K = num(inK), P = num(inP);
    if (!A || !K) return;
    const kPer = K / A, S = +sl.value / 100 * kPer, o = outcome(side, A, K, P, S);
    const sideC = side === "call" ? "var(--call)" : "var(--put)";
    $("lbSv").textContent = `${f(S, S < .001 ? 8 : 6)} SOL`;
    const W = 560, H = 250, pad = { l:52, r:14, t:14, b:30 }, N = 120;
    const xs = [...Array(N + 1)].map((_, i) => i / N * 2 * kPer);
    const by = xs.map(s => outcome(side, A, K, P, s).buyer), sy = xs.map(s => outcome(side, A, K, P, s).seller);
    let lo = Math.min(...by, ...sy, 0), hi = Math.max(...by, ...sy, 0); const span = (hi - lo) || 1; lo -= span*.08; hi += span*.08;
    const X = s => pad.l + s / (2*kPer) * (W - pad.l - pad.r), Y = v => pad.t + (hi - v) / (hi - lo) * (H - pad.t - pad.b);
    const line = ys => xs.map((s,i) => `${i ? "L" : "M"}${X(s).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join("");
    const be = side === "call" ? (K + P) / A : (K*.999 - P) / A;
    const ticks = [lo + (hi-lo)*.08, 0, hi - (hi-lo)*.08];
    $("lbChart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("lb.chart")}">
      <line class="ax" x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}"/>
      <line class="zero" x1="${pad.l}" y1="${Y(0)}" x2="${W-pad.r}" y2="${Y(0)}"/>

      <text x="${pad.l}" y="${H-10}">0</text><text x="${W-pad.r}" y="${H-10}" text-anchor="end">2× strike</text>
      <path d="${line(sy)}" fill="none" stroke="#c7b8ff" stroke-width="2"/>

      <line x1="${X(S)}" y1="${pad.t}" x2="${X(S)}" y2="${H-pad.b}" stroke="#fff" stroke-dasharray="2 4"/>

    </svg>`;
    const sg = v => `${v >= 0 ? "+" : "−"}${f(Math.abs(v), 4)} SOL`;
    $("lbRes").innerHTML = `<div><small><i style="background:${sideC}"></i>${t("lb.buyer")}</small><b style="color:${o.buyer >= 0 ? "var(--call)" : "#ff9bd9"}">${sg(o.buyer)}</b><em>${t("lb.vsPrem")}</em></div>
      <div><small><i style="background:#c7b8ff"></i>${t("lb.seller")}</small><b style="color:${o.seller >= 0 ? "var(--call)" : "#ff9bd9"}">${sg(o.seller)}</b><em>${t("lb.vsHold")}</em></div>`;
    $("lbVerdict").innerHTML = fill(t(`lb.${o.ex ? "ex" : "no"}.${side}`), { S:`<b>${f(S, 8)} SOL</b>`, amt:f(A, 0), sym:x.sym, val:`<b>${fE(o.val)}</b>`, K:fE(K) });

const ticketCard = (() => {
  const el = document.getElementById("tk"), stage = document.getElementById("finalStage");
  let last = 0, rx = 0, ry = 0, hx = 50, hy = 40, trx = 0, try_ = 0, thx = 50, thy = 40;
  function render(){
    const x = CONFIG.tokens[0], call = x.side === "call";
    const exp = new Date(Date.now() + 7*86400e3).toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" });
    el.innerHTML = `<div class="tk-in">
      <div class="tk-top"><span class="lg">${CONFIG.brand.toUpperCase()}</span><span class="side ${x.side}">${x.side.toUpperCase()}</span></div>
      <div class="tk-ring"><div><b>${fTok(x.amount)}</b><small>${x.sym} · ${t(call ? "tk.right" : "tk.rightp")}</small></div></div>
      <div style="text-align:center;font-size:12px;color:var(--ink-2)">${t(call ? "tk.call" : "tk.put")}</div>
      <div class="tk-rows">
        <div><span>${t("tk.size")}</span><b>${f(x.amount, 0)} ${x.sym}</b></div>
        <div><span>${t("tk.k")}</span><b>${fE(x.strike)}</b></div>
        <div><span>${t("tk.exp")}</span><b>${exp}</b></div>
        <div><span>${t("tk.st")}</span><b style="color:var(--call)">FILLED</b></div>
      </div>
      <div class="tk-id"><span>#${call ? 1 : 2}·0003</span><span>SPL NFT · Solana</span></div></div>`;
  }
  stage.addEventListener("pointermove", e => {
    const r = el.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    trx = (0.5 - Math.min(1.2, Math.max(-.2, py))) * 22; try_ = (Math.min(1.2, Math.max(-.2, px)) - .5) * 26;
    thx = px * 100; thy = py * 100; last = performance.now();
  });
  function tick(now, dt){
    if (now - last > 1800 && !reduceMotion) { const s = now / 1000; trx = Math.sin(s * .8) * 6; try_ = Math.sin(s * .6) * 12; thx = 50 + Math.sin(s * .6) * 40; thy = 40 + Math.cos(s * .5) * 25; }
    const k = 1 - Math.exp(-8 * dt);
    rx += (trx - rx) * k; ry += (try_ - ry) * k; hx += (thx - hx) * k; hy += (thy - hy) * k;
    el.style.setProperty("--rx", rx.toFixed(2) + "deg"); el.style.setProperty("--ry", ry.toFixed(2) + "deg");
    el.style.setProperty("--hx", hx.toFixed(1)); el.style.setProperty("--hy", hy.toFixed(1));
  }
  return { render, tick };
})();

/* =========================================================
   WEBGL helper for fullscreen shaders
   ========================================================= */
function glScene(canvas, frag){
  const gl = canvas.getContext("webgl", { antialias:false, alpha:false, powerPreference:"high-performance" });
  if (!gl) return null;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; } return s; };
  const vs = sh(gl.VERTEX_SHADER, "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}"), fs = sh(gl.FRAGMENT_SHADER, frag);
  if (!vs || !fs) return null;
  const prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {}; const u = n => U[n] ?? (U[n] = gl.getUniformLocation(prog, n));
  let W = 0, H = 0, dpr = 1;
  const api = {
    get W(){ return W; }, get H(){ return H; },
    dprScale: 1,
    resize(){
      const Q = CONFIG.quality, native = Math.max(devicePixelRatio || 1, 1);
      dpr = Math.max(Q.minPixelRatio * native > Q.maxPixelRatio ? Q.maxPixelRatio : Q.minPixelRatio,
                     Math.min(native * Q.supersample, Q.maxPixelRatio) * api.dprScale);
      W = canvas.clientWidth; H = canvas.clientHeight;
      canvas.width = Math.max(1, Math.round(W*dpr)); canvas.height = Math.max(1, Math.round(H*dpr));
      gl.viewport(0, 0, canvas.width, canvas.height);
    },
    render(time, set){
      gl.uniform2f(u("uRes"), W, H); gl.uniform1f(u("uDpr"), canvas.width / Math.max(1, W)); gl.uniform1f(u("uTime"), time);
      set && set((n, ...v) => v.length === 1 ? gl.uniform1f(u(n), v[0]) : v.length === 2 ? gl.uniform2f(u(n), v[0], v[1]) : gl.uniform3f(u(n), v[0], v[1], v[2]));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
  };
  api.resize();
  return api;
}

const HERO_FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uDpr, uTime, uIntro, uR; uniform vec2 uC;
uniform vec3 uBlue, uViolet, uLav;
const vec3 BG = vec3(3./255., 3./255., 21./255.);
float comet(vec2 p, vec2 oc, vec2 rad, float rot, float head, float dirS, out float hg){
  vec2 v = p - oc; float cs = cos(rot), sn = sin(rot);
  v = vec2(cs*v.x + sn*v.y, -sn*v.x + cs*v.y);
  vec2 q = v / rad; float r = length(q); float a = atan(q.y, q.x);
  float dist = abs(r - 1.) * length(v) / max(r, .001);
  float diff = mod((head - a) * dirS, 6.2831853);
  float trail = exp(-diff * 1.5);
  vec2 hp = vec2(cos(head), sin(head)) * rad;
  float hd = length(v - hp);
  hg = exp(-hd / 4.) * 1.3 + exp(-hd / 24.) * .45;
  return exp(-dist / 1.3) * trail * 1.3 + exp(-dist / 9.) * trail * .5 + exp(-dist / 1.6) * .05;
}
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uDpr - gl_FragCoord.y) / uDpr;
  float e = uIntro;
  vec2 c = uC + vec2(0., (1. - e) * uRes.y * .05);
  vec2 v = p - c; float L = length(v); float d = L - uR; vec2 dir = v / max(L, 1.);
  float ang = atan(dir.y, dir.x);
  float bottomMask = mix(smoothstep(.1, .95, dir.y), 1., smoothstep(.15, .85, e));
  float shimmer = .86 + .14 * sin(ang * 3. - uTime * .7) + .08 * sin(ang * 7. + uTime * 1.2);
  vec3 tint = mix(uBlue, uViolet, smoothstep(-.3, .9, dir.x));
  float core = exp(-abs(d) / .7) + exp(-abs(d) / 2.4) * .45, nearG = exp(-abs(d) / 7.), wide = exp(-abs(d) / (uR * .12));
  float echo = exp(-abs(d + 16.) / 1.2) * .16 + exp(-abs(d + 34.) / 1.6) * .07;
  float sparkle = pow(max(0., sin(ang * 90. + uTime * 2.1) * sin(ang * 37. - uTime * 1.4)), 16.) * exp(-abs(d) / 3.) * 1.6;
  vec3 light = (vec3(1.) * core * 1.7 + mix(uLav, tint, .4) * nearG * .95 + tint * wide * mix(.2, .95, e)) * bottomMask * shimmer * mix(.55, 1., e);
  light += (tint * echo + vec3(1.) * sparkle) * bottomMask * e;
  float inside = 1. - smoothstep(-2., 2., d);
  float flood = exp(d / (uR * .26));
  float topB = smoothstep(.1, -1., dir.y);
  light += inside * uBlue * (flood * .6 + topB * .3 + .05) * e;
  float outside = 1. - inside;
  light += outside * tint * exp(-d / (uR * .45)) * .35 * e * bottomMask;
  float hg1, hg2;
  float c1 = comet(p, c + vec2(0., uR * .6), vec2(uR * .55, uR * .15), -.08, uTime * .9, 1., hg1);
  float c2 = comet(p, c + vec2(uR * .05, uR * .75), vec2(uR * .34, uR * .09), .12, -uTime * 1.2 + 2., -1., hg2);
  float cv = smoothstep(.35, 1., e) * inside;
  light += mix(vec3(.35, .4, 1.), vec3(1., .5, .95), .35) * (c1 + c2) * cv + vec3(1.) * (hg1 + hg2) * cv;
  vec2 cell = floor(p / 46.); vec2 lp = fract(p / 46.) * 46.;
  float h = fract(sin(dot(cell, vec2(127.1, 311.7))) * 43758.5453);
  vec2 sp = vec2(fract(h * 13.7), fract(h * 71.3)) * 46.;
  float tw = .5 + .5 * sin(uTime * (1. + h * 2.) + h * 40.);
  light += vec3(.75, .78, 1.) * step(.82, h) * exp(-length(lp - sp) / .6) * tw * .9 * e;
  light *= smoothstep(uRes.y, uRes.y * .8, p.y);
  vec3 col = BG + (1. - exp(-light * 1.25));
  col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - .5) / 255.;
  gl_FragColor = vec4(col, 1.);
}`;

const ECLIPSE_FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uDpr, uTime, uP;
const vec3 BG = vec3(3./255., 3./255., 21./255.);
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uDpr - gl_FragCoord.y) / uDpr;
  vec2 c = vec2(uRes.x * .5, uRes.y * .47);
  float r = min(uRes.x * .17, uRes.y * .3);
  float P = uP;
  float dO = length(p - c) - r;
  float o = mix(r * .015, r * .17, P);
  float dL = length(p - (c + vec2(-o, -o * .05))) - r;
  float cres = (1. - smoothstep(-1.5, 1.5, dL)) * smoothstep(-1., 1.5, dO);
  vec2 dir = normalize(p - c);
  float left = smoothstep(.25, -.9, dir.x);
  float outside = smoothstep(-1., 1., dO);
  float rim = exp(-max(dO, 0.) / 10.) * left * P;
  float bloom = exp(-length(p - (c + vec2(-r * .95, 0.))) / (r * mix(.25, .8, P))) * mix(.35, 1.35, P);
  float halo = exp(-max(dO, 0.) / (r * .75)) * (.4 + .45 * P);
  vec3 white = vec3(1., .96, 1.), lav = vec3(.78, .62, 1.), blue = vec3(.18, .2, 1.), mag = vec3(.85, .35, 1.);
  float pulse = .95 + .05 * sin(uTime * 1.3);
  vec3 light = (lav * rim * 1.2 + mix(lav, white, .5) * bloom * pulse + blue * halo * .95 + mag * exp(-abs(dO) / 3.) * left * P * .8) * outside;
  light += white * cres * smoothstep(0., .3, P) * 1.7;
  float inside = 1. - outside;
  light = mix(light, blue * .05 * exp(dO / (r * .3)) + blue * .07 * smoothstep(r * .14, r * .05, length(p - (c + vec2(r * .3, -r * .1)))), inside * (1. - cres));
  vec3 col = BG + (1. - exp(-light * 1.2));
  col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - .5) / 255.;
  gl_FragColor = vec4(col, 1.);
}`;

/* =========================================================
   MAIN LOOP — one rAF, only what is visible
   ========================================================= */
const heroCanvas = document.getElementById("heroGL"), eclCanvas = document.getElementById("eclipseGL");
const hero = glScene(heroCanvas, HERO_FRAG), ecl = glScene(eclCanvas, ECLIPSE_FRAG);
if (!hero) heroCanvas.style.background = "radial-gradient(60% 60% at 50% 0%,#2a2cff55,transparent 70%)";

const locStage = document.getElementById("locStage");
const bigGlobe = createGlobe(document.getElementById("globeGL"), {
  step: CONFIG.quality.globeDensity, speed: .05, rot: -.35, tilt: .42, dot: 1.9, rim: 1.5, glow: .24, base: .34, light:[-.35,.75,.55],
  layout: (W,H) => { const R = Math.min(W*.3, H*.42, 420); return { cx: W*.46, cy: H*.62, R }; }
});

function placeLoc(){
  const W = locStage.clientWidth, H = locStage.clientHeight;
  const R = Math.min(W*.3, H*.42, 420), cx = W*.46, cy = H*.62;
  const m1 = { x: cx - R*.42, y: cy - R*.57 }, m2 = { x: cx + R*.98, y: cy - R*.4 };
  const mob = W < 640;
  Object.assign(document.getElementById("m1").style, { left:m1.x+"px", top:m1.y+"px" });
  Object.assign(document.getElementById("m2").style, { left:m2.x+"px", top:m2.y+"px" });
  const s1 = document.getElementById("s1"), s2 = document.getElementById("s2");
  const l1 = mob ? 30 : Math.max(40, m1.x - Math.max(20, cx - R*1.25) - 20);
  s1.style.left = (m1.x - 16 - l1) + "px"; s1.style.top = m1.y + "px"; s1.querySelector(".ln").style.width = l1 + "px";
  s1.querySelector(".lbl").style.cssText = `right:${l1+6}px;text-align:right`;
  const l2 = mob ? 24 : 60;
  s2.style.left = (m2.x + 16) + "px"; s2.style.top = m2.y + "px"; s2.querySelector(".ln").style.width = l2 + "px";
  s2.querySelector(".lbl").style.cssText = `left:${l2+8}px;bottom:auto;top:-20px`;
  s1.querySelector(".lbl").style.bottom = "-6px";
  document.getElementById("locText").style.top = (cy + R*.05) + "px";
}

const vis = new Map();
const io = new IntersectionObserver(es => es.forEach(e => vis.set(e.target, e.isIntersecting)), { rootMargin:"100px" });
const stageEl = document.getElementById("stage");
[heroCanvas, eclCanvas, locStage, document.getElementById("finalStage"), stageEl].forEach(el => io.observe(el));

function onResize(){ hero && hero.resize(); ecl && ecl.resize(); bigGlobe.resize(); placeLoc(); }
addEventListener("resize", onResize); onResize();

const faders = [...document.querySelectorAll("[data-fade]")];
const finalStage = document.getElementById("finalStage"), tkSlot = document.getElementById("tkSlot");
let eclP = 0, eclTarget = 0, rise = 1, riseTarget = 1;
function onScroll(){
  const vh = innerHeight;
  faders.forEach(el => {
    const r = el.getBoundingClientRect();
    const off = (r.top + r.height/2 - vh/2) / vh;
    const a = Math.abs(off), o = 1 - Math.min(1, Math.max(0, (a - .42) / .4));
    el.style.opacity = (o*o*(3-2*o)).toFixed(3);
    el.style.transform = `translateY(${(off * -30).toFixed(1)}px)`;
  });
  const er = eclCanvas.getBoundingClientRect();
  eclTarget = Math.min(1, Math.max(0, 1 - (er.top + er.height*.5 - vh*.38) / (vh*.55)));
  const fr = finalStage.getBoundingClientRect();
  riseTarget = Math.min(1, Math.max(0, (fr.top - vh*.35) / (vh*.5)));
}
addEventListener("scroll", onScroll, { passive:true }); onScroll();

const rio = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); rio.unobserve(e.target); } }), { threshold:.2 });
document.querySelectorAll(".reveal").forEach(el => rio.observe(el));

const cio = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return; cio.unobserve(e.target);
  const target = CONFIG.stats[e.target.dataset.count] || 0, t0 = performance.now();
  (function step(n){ const p = Math.min(1, Math.max(0, (n - t0)/1400)); e.target.textContent = Math.round(target*(1-Math.pow(1-p,3))); if (p < 1) requestAnimationFrame(step); })(t0);
}), { threshold:.6 });
document.querySelectorAll("[data-count]").forEach(el => cio.observe(el));

let introStart = null;
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
let last = performance.now(), clock = 0, slow = 0, fast = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  clock += dt * (reduceMotion ? .2 : 1);
  if (introStart === null) introStart = now;
  const ip = Math.min(1, Math.max(0, (now - introStart - 250) / 2200));
  const intro = reduceMotion ? 1 : 1 - Math.pow(1 - ip, 3);

  if (hero && vis.get(heroCanvas) !== false) {
    const W = hero.W, H = hero.H;
    const R = W < 700 ? W * .62 : Math.min(W * CONFIG.hero.radius, 640);
    hero.render(clock, s => {
      s("uIntro", intro); s("uR", R); s("uC", W/2, H*.575 - R);
      s("uBlue", ...CONFIG.hero.ringBlue); s("uViolet", ...CONFIG.hero.ringViolet); s("uLav", ...CONFIG.hero.ringLav);
    });
  }
  eclP = damp(eclP, eclTarget, 4, dt);
  if (ecl && vis.get(eclCanvas)) ecl.render(clock, s => s("uP", eclP));
  if (vis.get(locStage)) bigGlobe.render(clock);
  rise = damp(rise, riseTarget, 5, dt);
  tkSlot.style.setProperty("--rise", rise.toFixed(4));
  if (vis.get(finalStage)) ticketCard.tick(now, dt);
  if (vis.get(stageEl)) engine.tick(now);

  if (dt > 1/42) { slow += dt; fast = 0; } else { slow = Math.max(0, slow - dt*.5); fast += dt; }
  if (hero && slow > 1.5 && hero.dprScale > .7) { hero.dprScale = +(hero.dprScale - .1).toFixed(2); if (ecl) ecl.dprScale = hero.dprScale; onResize(); slow = 0; }
  if (hero && fast > 4 && hero.dprScale < 1) { hero.dprScale = +(hero.dprScale + .1).toFixed(2); if (ecl) ecl.dprScale = hero.dprScale; onResize(); fast = 0; }
}
applyLang();
engine.onScroll();
requestAnimationFrame(t => { last = t; document.documentElement.classList.add("ready"); frame(t); });
</script>
